<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="verdant-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="50%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#081c15"/>
    </linearGradient>
    <linearGradient id="leaf-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95d5b2"/>
      <stop offset="50%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <linearGradient id="leaf-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8f3dc"/>
      <stop offset="50%" stop-color="#74c69d"/>
      <stop offset="100%" stop-color="#40916c"/>
    </linearGradient>
    <linearGradient id="sun-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#verdant-bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(149, 213, 178, 0.25)" stroke-width="8"/>

  <!-- Botanical Sprout Emblem -->
  <!-- Left Leaf -->
  <path d="M 256,390 C 256,390 140,360 130,240 C 120,130 240,110 256,110 C 256,110 250,230 256,390 Z" 
        fill="url(#leaf-glow)" opacity="0.9" filter="url(#glow)"/>

  <!-- Right Leaf -->
  <path d="M 256,390 C 256,390 370,350 380,250 C 390,150 290,140 256,150 C 256,150 270,260 256,390 Z" 
        fill="url(#leaf-front)"/>

  <!-- Center Stem Vein -->
  <path d="M 256,410 C 256,330 254,220 256,110" 
        stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.85"/>

  <!-- Dewdrop / Sun Spark -->
  <circle cx="360" cy="140" r="28" fill="url(#sun-spark)" filter="url(#glow)"/>
  <path d="M 360,105 L 364,128 L 385,132 L 366,144 L 372,165 L 354,152 L 336,165 L 342,144 L 325,132 L 346,128 Z" 
        fill="#ffffff" opacity="0.9"/>
</svg>
